[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelctl"
version = "0.2.0"
description = "Model Management System — single source of truth for all models"
authors = []
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
modelctl = "modelctl.cli:main"

[tool.setuptools.packages.find]
include = ["modelctl*"]
