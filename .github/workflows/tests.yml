name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      cli: ${{ steps.filter.outputs.cli }}
      orch: ${{ steps.filter.outputs.orch }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'libs/modelctl-core/**'
            cli:
              - 'apps/modelctl/**'
            orch:
              - 'libs/modelctl-orch/**'
            config:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.github/workflows/**'

  test:
    needs: changes
    if: |
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.orch == 'true' ||
      needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Determine Make targets
        id: targets
        run: |
          if [ "${{ needs.changes.outputs.config }}" = "true" ]; then
            echo "targets=test" >> "$GITHUB_OUTPUT"
          else
            TARGETS=""
            [ "${{ needs.changes.outputs.core }}" = "true" ] && TARGETS="$TARGETS test-core"
            [ "${{ needs.changes.outputs.cli }}" = "true" ] && TARGETS="$TARGETS test-cli"
            [ "${{ needs.changes.outputs.orch }}" = "true" ] && TARGETS="$TARGETS test-orch"
            echo "targets=${TARGETS# }" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: make ${{ steps.targets.outputs.targets }}
