services:

  # ── Nginx reverse proxy ─────────────────────────────────────────────
  #     Single entry point for all inference requests. Routes to
  #     per-capability containers on the internal modelctl-net.
  nginx:
    image: nginx:alpine
    container_name: modelctl-nginx
    ports:
      - "${NGINX_PORT:-6060}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - llms-gateway
    networks:
      - modelctl-net

  llms-gateway:
    build:
      context: .
      dockerfile: Dockerfile.llamacpp.server
    container_name: llms-gateway
    ports:
      - "${MODELCTL_API_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/LLMGateway-Models/registry:${HOME}/LLMGateway-Models/registry
      - ${HOME}/LLMGateway-Models:${HOME}/LLMGateway-Models
    environment:
      - MODELCTL_API_REGISTRY_DIR=${HOME}/LLMGateway-Models/registry
      - MODELCTL_API_STORAGE_DIR=${HOME}/LLMGateway-Models/storage
      - MODELCTL_REGISTRY_DIR=${HOME}/LLMGateway-Models/registry
      - MODELCTL_STORAGE_DIR=${HOME}/LLMGateway-Models/storage
      - MODELCTL_API_PORT=${MODELCTL_API_PORT:-8000}
      - HF_TOKEN=${HF_TOKEN:-}
    networks:
      - modelctl-net

networks:
  modelctl-net:
    external: true
    name: ${MODELCTL_NETWORK:-modelctl-net}
