# nginx.conf — Reverse proxy for llms-gateway
#
# Routes inference requests to the correct per-capability container
# on the internal Docker network (modelctl-net). No inference ports
# are exposed to the host — only Nginx is.

events {}

http {
    # ── Docker DNS resolver ─────────────────────────────────────────
    # Uses Docker's embedded DNS at 127.0.0.11 so upstream names
    # (modelctl-chat, etc.) resolve dynamically on modelctl-net.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Proxy timeouts (long for streaming inference) ───────────────
    proxy_connect_timeout 10s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;

    server {
        listen 80;

        # ── Chat completions ────────────────────────────────────────
        location /v1/chat/completions {
            set $upstream modelctl-chat:8080;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;           # required for SSE streaming
            proxy_cache off;
            proxy_request_buffering off;   # stream request body to backend
        }

        # ── Embeddings ──────────────────────────────────────────────
        location /v1/embeddings {
            set $upstream modelctl-embedding:8080;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
        }

        # ── Reranker ────────────────────────────────────────────────
        location /v1/rerank {
            set $upstream modelctl-reranker:8080;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Vision ──────────────────────────────────────────────────
        location /v1/vision {
            set $upstream modelctl-vision:8080;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
        }

        # ── Experimental ────────────────────────────────────────────
        location /v1/experimental {
            set $upstream modelctl-experimental:8080;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Management API + SPA frontend ───────────────────────────
        location / {
            set $upstream llms-gateway:8000;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
