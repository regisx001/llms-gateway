[project]
name = "llms-gateway"
version = "0.2.0"
description = "LLM Inference Gateway — monorepo"
requires-python = ">=3.10"
dependencies = [
    "modelctl-core",
    "modelctl",
    "openai>=2.45.0",
]

[tool.uv.sources]
modelctl-core = { workspace = true }
modelctl-orch = { workspace = true }
modelctl = { workspace = true }
modelctl-api = { workspace = true }

[tool.uv.workspace]
members = ["libs/*", "apps/*"]

[tool.pytest.ini_options]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "modelctl-api",
    "pytest>=8.0",
]
