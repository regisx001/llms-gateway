[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelctl"
version = "0.2.0"
description = "Model Management CLI"
requires-python = ">=3.10"
dependencies = [
    "modelctl-core",
    "requests>=2.28",
]

[project.scripts]
modelctl = "modelctl.cli:main"

[tool.uv.sources]
modelctl-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/modelctl"]
